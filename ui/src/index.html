<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RenzBase</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <nav class="rail" aria-label="Sections">
        <div class="rail-top">
          <button class="rail-btn is-active" data-view="home" title="Home" aria-label="Home">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 6-6 6 6 6"/><path d="m16 6 6 6-6 6"/></svg>
          </button>
          <button class="rail-btn" data-view="library" title="Library" aria-label="Library">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19.5V5a2 2 0 0 1 2-2h12v18H6a2 2 0 0 1-2-2Z"/><path d="M8 7h7"/></svg>
          </button>
          <button class="rail-btn" data-view="clients" title="Clients" aria-label="Clients">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8"/></svg>
          </button>
        </div>
        <div class="rail-bottom">
          <button class="rail-btn" data-view="settings" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2V21a2 2 0 1 1-4 0v-.1A1.7 1.7 0 0 0 7 19.4a1.7 1.7 0 0 0-1.9.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 0 1-2-2 2 2 0 0 1 2-2 1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 9 5.6V5.4A2 2 0 0 1 11 3.4a2 2 0 0 1 2 2v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 20.4 12a2 2 0 0 1 2 2 2 2 0 0 1-2 2Z"/></svg>
          </button>
        </div>
      </nav>

      <aside class="explorer">
        <div class="explorer-head">
          <span>Explorer</span>
          <button class="icon-btn" id="new-script" title="New script" aria-label="New script">+</button>
        </div>
        <div class="search-wrap">
          <input id="search" class="search" type="text" placeholder="Search files..." spellcheck="false" autocomplete="off" />
        </div>
        <div class="tree" id="tree"></div>
        <div class="explorer-foot">
          <button class="link-btn" id="open-folder">scripts folder</button>
        </div>
      </aside>

      <main class="main">
        <div class="tabbar">
          <div class="tabs" id="tabs"></div>
          <button class="launch" id="launch"><span class="launch-dot" aria-hidden="true"></span>Launch</button>
        </div>
        <div class="toolbar">
          <button class="tool" id="run" title="Run the active script (Ctrl+Enter)">Run</button>
          <button class="tool" id="clear-console" title="Clear the console">Clear</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="tool" id="open-file" title="Open a .lua file">Open</button>
          <button class="tool" id="save" title="Save the active script (Ctrl+S)">Save</button>
          <button class="tool" id="copy" title="Copy the active script">Copy</button>
          <span class="tool-sep" aria-hidden="true"></span>
          <button class="tool" id="snippets" title="The library folder">Snippets</button>
          <button class="tool" id="attach" title="Attach to the running client">Clients</button>
          <span class="toolbar-grow"></span>
          <span class="clients" id="clients">no client</span>
        </div>
        <section class="content" id="content"></section>
      </main>

      <footer class="statusbar">
        <span id="status-left">ready</span>
        <span class="grow"></span>
        <span id="status-right"></span>
      </footer>
    </div>

    <div class="toast-stack" id="toasts" aria-live="polite"></div>
    <script src="main.js"></script>
  </body>
</html>
