[package]
name = "renzbase-ui"
version = "0.2.0"
description = "RenzBase - one executable: window, injector and payload"
authors = ["RenzBase"]
license = "MIT"
edition = "2021"
rust-version = "1.77"

[lib]
name = "renzbase_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
