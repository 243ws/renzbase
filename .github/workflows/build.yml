name: build-exe

# One exe, built in GitHub: the DLL is compiled, baked into the Tauri binary as
# bytes, and the artifact is a single RenzBase.exe. Nothing else ships.

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build Module.dll
        shell: cmd
        run: msbuild dll\SkidBase.vcxproj -p:Configuration=Release -p:Platform=x64 -m -v:minimal

      - name: Embed the payload in the app
        shell: cmd
        run: |
          if not exist ui\src-tauri\assets mkdir ui\src-tauri\assets
          copy /Y dll\Release\Module.dll ui\src-tauri\assets\Module.dll
          dir ui\src-tauri\assets

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build the single exe
        working-directory: ui/src-tauri
        run: cargo build --release --features custom-protocol

      - name: Collect RenzBase.exe
        shell: cmd
        run: |
          mkdir out
          copy ui\src-tauri\target\release\renzbase-ui.exe out\RenzBase.exe
          dir out

      - name: Upload the exe
        uses: actions/upload-artifact@v4
        with:
          name: RenzBase-win64
          path: out/RenzBase.exe
          if-no-files-found: error
